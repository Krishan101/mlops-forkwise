apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: forkwise-platform
spec:
  type: NodePort
  selector: { app: mlflow }
  ports:
  - { port: 5000, targetPort: 5000, nodePort: 30500 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: forkwise-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: mlflow }
  template:
    metadata:
      labels: { app: mlflow }
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.19.0
        ports: [{ containerPort: 5000 }]
        command: ["mlflow", "server"]
        args:
        - "--host=0.0.0.0"
        - "--port=5000"
        - "--backend-store-uri=postgresql://forkwise:forkwise-secret-pw@platform-db:5432/mlflow"
        - "--default-artifact-root=s3://data-proj01/mlflow-artifacts"
        env:
        - { name: AWS_ACCESS_KEY_ID, value: "8921c48faf83433db2b1439a9b2889fd" }
        - { name: AWS_SECRET_ACCESS_KEY, value: "7d1ce78efc5a48019888c9f3fa8ba2dd" }
        - { name: MLFLOW_S3_ENDPOINT_URL, value: "https://chi.tacc.chameleoncloud.org:7480" }
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
