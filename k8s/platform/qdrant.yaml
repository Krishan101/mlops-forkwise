apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: forkwise-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: forkwise-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.13.2
        ports:
        - { containerPort: 6333 }
        - { containerPort: 6334 }
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        resources:
          requests: { cpu: 200m, memory: 256Mi }
          limits:   { cpu: "1", memory: 1Gi }
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: forkwise-platform
spec:
  selector: { app: qdrant }
  ports:
  - { name: http, port: 6333, targetPort: 6333 }
  - { name: grpc, port: 6334, targetPort: 6334 }
