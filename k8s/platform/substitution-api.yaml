apiVersion: v1
kind: Service
metadata:
  name: substitution-api
  namespace: forkwise-platform
spec:
  type: NodePort
  selector: { app: substitution-api }
  ports:
  - { port: 8080, targetPort: 8080, nodePort: 30808 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gismo-model-pvc
  namespace: forkwise-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substitution-api
  namespace: forkwise-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: substitution-api }
  template:
    metadata:
      labels: { app: substitution-api }
    spec:
      initContainers:
      - name: download-model
        image: amazon/aws-cli:2.15.0
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Download GISMo model artifacts from Chameleon object storage
          # Only download if not already present (idempotent)
          if [ ! -f /model/gismo_decoder.onnx ]; then
            echo "Downloading GISMo model artifacts..."
            aws --endpoint-url $S3_ENDPOINT s3 cp s3://data-proj01/models/v2/gismo_decoder.onnx /model/gismo_decoder.onnx || true
            aws --endpoint-url $S3_ENDPOINT s3 cp s3://data-proj01/models/v2/ingredient_embeddings.npy /model/ingredient_embeddings.npy || true
            aws --endpoint-url $S3_ENDPOINT s3 cp s3://data-proj01/models/v2/vocab.json /model/vocab.json || true
            aws --endpoint-url $S3_ENDPOINT s3 cp s3://data-proj01/models/v2/metadata.json /model/metadata.json || true
            echo "Download complete"
          else
            echo "Model already present, skipping download"
          fi
        env:
        - { name: AWS_ACCESS_KEY_ID, value: "8921c48faf83433db2b1439a9b2889fd" }
        - { name: AWS_SECRET_ACCESS_KEY, value: "7d1ce78efc5a48019888c9f3fa8ba2dd" }
        - { name: S3_ENDPOINT, value: "https://chi.tacc.chameleoncloud.org:7480" }
        volumeMounts:
        - name: gismo-model
          mountPath: /model
      containers:
      - name: substitution-api
        image: ghcr.io/krishan101/forkwise-substitution-api:0.2.0
        imagePullPolicy: Always
        ports: [{ containerPort: 8080 }]
        env:
        - { name: POSTGRES_HOST, value: "platform-db" }
        - { name: POSTGRES_PORT, value: "5432" }
        - { name: POSTGRES_DB, value: "forkwise_mlops" }
        - { name: POSTGRES_USER, value: "forkwise" }
        - { name: POSTGRES_PASSWORD, value: "forkwise-secret-pw" }
        - { name: QDRANT_HOST, value: "qdrant" }
        - { name: QDRANT_PORT, value: "6333" }
        - { name: GISMO_ENABLED, value: "true" }
        - { name: GISMO_MODEL_DIR, value: "/app/gismo_model" }
        - { name: MODEL_VERSION, value: "current" }
        volumeMounts:
        - name: gismo-model
          mountPath: /app/gismo_model
        readinessProbe:
          httpGet: { path: /ready, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits:   { cpu: "2", memory: 3Gi }
      volumes:
      - name: gismo-model
        persistentVolumeClaim:
          claimName: gismo-model-pvc
