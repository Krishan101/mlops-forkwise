apiVersion: v1
kind: Service
metadata:
  name: substitution-api
  namespace: forkwise-platform
spec:
  type: NodePort
  selector: { app: substitution-api }
  ports:
  - { port: 8080, targetPort: 8080, nodePort: 30808 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: substitution-api
  namespace: forkwise-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: substitution-api }
  template:
    metadata:
      labels: { app: substitution-api }
    spec:
      containers:
      - name: substitution-api
        image: ghcr.io/krishan101/forkwise-substitution-api:0.1.0
        imagePullPolicy: Always
        ports: [{ containerPort: 8080 }]
        env:
        - { name: POSTGRES_HOST, value: "platform-db" }
        - { name: POSTGRES_PORT, value: "5432" }
        - { name: POSTGRES_DB, value: "forkwise_mlops" }
        - { name: POSTGRES_USER, value: "forkwise" }
        - { name: POSTGRES_PASSWORD, value: "forkwise-secret-pw" }
        - { name: QDRANT_HOST, value: "qdrant" }
        - { name: QDRANT_PORT, value: "6333" }
        readinessProbe:
          httpGet: { path: /ready, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits:   { cpu: "2", memory: 3Gi }
