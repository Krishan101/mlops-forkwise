apiVersion: v1
kind: Secret
metadata:
  name: platform-db-credentials
  namespace: forkwise-platform
type: Opaque
stringData:
  POSTGRES_USER: forkwise
  POSTGRES_PASSWORD: forkwise-secret-pw
  POSTGRES_DB: forkwise_mlops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-db-pvc
  namespace: forkwise-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-db
  namespace: forkwise-platform
spec:
  serviceName: platform-db
  replicas: 1
  selector:
    matchLabels: { app: platform-db }
  template:
    metadata:
      labels: { app: platform-db }
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports: [{ containerPort: 5432 }]
        envFrom:
        - secretRef: { name: platform-db-credentials }
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests: { cpu: 200m, memory: 256Mi }
          limits:   { cpu: "1", memory: 512Mi }
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: platform-db-pvc
      - name: init-sql
        configMap:
          name: platform-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: platform-db
  namespace: forkwise-platform
spec:
  selector: { app: platform-db }
  ports:
  - { port: 5432, targetPort: 5432 }
